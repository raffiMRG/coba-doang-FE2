# Direct LAN/Tailscale access never sends X-Forwarded-Proto (cloudflared
# always does), so use its presence to tell the two cases apart: through the
# tunnel we're https on the default port; direct we're http on the published
# host port (8000).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      http;
}
map $http_x_forwarded_proto $forwarded_port {
    default 443;
    ''      8000;
}

server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;

    client_max_body_size 50M;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Global SSE for /status (realtime list on every device). nginx holds
    # the long-lived connection and proxies it straight to the Go backend,
    # so an open tab doesn't pin a PHP-FPM worker for its whole lifetime.
    # PHP is only hit once per (re)connect, via auth_request, to check the
    # session and hand nginx the backend token — that header never reaches
    # the browser. ${API_BASEURL} is filled in at container start.
    location = /status/events {
        auth_request /internal/sse-auth;
        auth_request_set $backend_token $upstream_http_x_backend_token;

        proxy_pass ${API_BASEURL}/folders/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "Bearer $backend_token";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /internal/sse-auth {
        internal;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # A subrequest keeps the original $request_uri (/status/events);
        # Laravel routes on REQUEST_URI, so point it at the auth route.
        fastcgi_param REQUEST_URI /internal/sse-auth;
        fastcgi_param QUERY_STRING "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
    }

    location ~ /\.ht {
        deny all;
    }
}
